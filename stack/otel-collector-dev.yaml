# Development collector — deliberately different from otel-collector.yaml:
# no batching, verbose logs, and every payload written to disk so a single hook
# event is visible immediately instead of being smoothed away by a 5s batch.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Same stitching the production collector does. Kept in its own pipeline so
  # the raw deltas stay observable side by side with the cumulative result.
  deltatocumulative:

exporters:
  # verbosity: detailed prints every data point with its attributes, which is
  # what makes `docker compose logs -f` usable as the primary dev feedback loop.
  debug:
    verbosity: detailed

  file/raw:
    path: /output/raw.jsonl

  file/cumulative:
    path: /output/cumulative.jsonl

  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: info

  pipelines:
    # Exactly what the emitter sent, including delta temporality from the
    # Claude bridge. Use this to check attributes and metric names.
    metrics/raw:
      receivers: [otlp]
      exporters: [debug, file/raw]

    # What Prometheus would end up scraping. Use this to check counter totals
    # and to reproduce delta-stitching bugs.
    metrics/cumulative:
      receivers: [otlp]
      processors: [deltatocumulative]
      exporters: [file/cumulative, prometheus]
