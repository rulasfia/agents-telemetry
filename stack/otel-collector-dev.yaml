receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # The Claude Code plugin runs one short-lived process per hook event, so it
  # exports delta metrics — a cumulative counter would restart at zero every
  # time and Prometheus would see a permanently flat series. This stitches the
  # per-process deltas back into the cumulative counters Prometheus expects.
  # The pi extension exports cumulative and passes through unchanged.
  deltatocumulative:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: ""
    const_labels:
      source: pi-otlp
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, deltatocumulative, batch]
      exporters: [prometheus, debug]
